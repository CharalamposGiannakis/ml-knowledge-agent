services:
  fuseki:
    # Community image with the Fuseki UI + simple ADMIN_PASSWORD interface.
    # NOTE: verify a current tag against Docker Hub before first run — Jena is on 5.x.
    # Alternatives if this tag is unavailable: daschswiss/apache-jena-fuseki:<5.x>,
    # secoresearch/fuseki, or the official jena-fuseki-docker package.
    image: stain/jena-fuseki:latest
    container_name: mlkg-fuseki
    ports:
      - "3030:3030"
    environment:
      # Read from .env (see .env.example). Falls back to "admin" for local dev.
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD:-admin}
    volumes:
      # FUSEKI_BASE — datasets persist here across container restarts.
      - fuseki-data:/fuseki
    restart: unless-stopped

volumes:
  fuseki-data:
