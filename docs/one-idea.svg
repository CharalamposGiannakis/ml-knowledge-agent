<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="560" height="470" rx="12" fill="#ffffff"/>
<rect x="20" y="20" width="520" height="120" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="36" y="46" font-size="14" font-weight="600" fill="#475569">1 &#183; Ingesting a paper</text>
<rect x="44" y="60" width="200" height="60" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
<text x="144" y="86" font-size="14" fill="#1e3a8a" text-anchor="middle">model proposes<tspan x="144" dy="18">structured data</tspan></text>
<line x1="252" y1="90" x2="308" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
<rect x="316" y="60" width="200" height="60" rx="8" fill="#1d4ed8" stroke="#1e40af"/>
<text x="416" y="86" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">code writes<tspan x="416" dy="18">the triples</tspan></text>
<rect x="20" y="162" width="520" height="120" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="36" y="188" font-size="14" font-weight="600" fill="#475569">2 &#183; Answering a question</text>
<rect x="44" y="202" width="200" height="60" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
<text x="144" y="228" font-size="14" fill="#1e3a8a" text-anchor="middle">model picks<tspan x="144" dy="18">a query shape</tspan></text>
<line x1="252" y1="232" x2="308" y2="232" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
<rect x="316" y="202" width="200" height="60" rx="8" fill="#1d4ed8" stroke="#1e40af"/>
<text x="416" y="228" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">code writes<tspan x="416" dy="18">the SPARQL</tspan></text>
<rect x="20" y="304" width="520" height="120" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="36" y="330" font-size="14" font-weight="600" fill="#475569">3 &#183; Stating the answer</text>
<rect x="44" y="344" width="200" height="60" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
<text x="144" y="370" font-size="14" fill="#1e3a8a" text-anchor="middle">model resolves<tspan x="144" dy="18">the entities</tspan></text>
<line x1="252" y1="374" x2="308" y2="374" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
<rect x="316" y="344" width="200" height="60" rx="8" fill="#1d4ed8" stroke="#1e40af"/>
<text x="416" y="370" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">code writes<tspan x="416" dy="18">the sentence</tspan></text>
<text x="280" y="454" font-size="13" fill="#64748b" text-anchor="middle" font-style="italic">The model proposes intent; code writes every fact — three times over.</text>
</svg>