# ---------------------------------------------------------------------------
# Customized for this project (mounted over $FUSEKI_HOME/shiro.ini — see
# docker-compose.yml). Only the [urls] section differs from
# daschswiss/apache-jena-fuseki:5.5.0-3's stock template: that image's
# default denies EVERYTHING (including plain SPARQL SELECT) without admin
# auth via a catch-all `/** = authcBasic,user[admin]`. This project's read
# path (scripts/query.py, scripts/healthcheck.py, and — eventually — the
# Phase-3 read-only query agent) must never hold admin credentials just to
# run a SELECT (least privilege), so /*/query and /*/sparql are opened to
# anon here. Every write/admin path (dataset admin, SPARQL update, GSP
# upload/data, and the catch-all) stays authcBasic,user[admin].
#
# The [users] "pw" values below are the stock image's own placeholder
# tokens, not secrets — docker-entrypoint.sh substitutes the admin one with
# $ADMIN_PASSWORD (and mints a random healthcheck credential) into
# $FUSEKI_BASE/shiro.ini on every container start. Never put a literal
# password in this file — and note the entrypoint's own sanity check greps
# the WHOLE file for the substituted-placeholder pattern, so don't even
# mention that pattern in a comment (this one included; it's phrased to
# avoid it) or the check will false-positive.
# ---------------------------------------------------------------------------

[main]
# Development
ssl.enabled = false

plainMatcher=org.apache.shiro.authc.credential.SimpleCredentialsMatcher
#iniRealm=org.apache.shiro.realm.text.IniRealm
iniRealm.credentialsMatcher = $plainMatcher

#localhost=org.apache.jena.fuseki.authz.LocalhostFilter

rest=org.apache.shiro.web.filter.authz.HttpMethodPermissionFilter

[users]
# Implicitly adds "iniRealm =  org.apache.shiro.realm.text.IniRealm"
admin=pw,adminRole
healthcheck=pw,healthcheckRole

[roles]
adminRole=datasets:read,datasets:create,datasets:update,datasets:delete
healthcheckRole=datasets:read

[urls]
## Control functions open to anyone
/$/status  = anon
/$/server  = anon
/$/ping    = anon
/$/metrics = anon

## Read-only SPARQL (query) is open to anyone (least privilege: the
## read-only query agent must not need admin credentials for a SELECT).
/*/query   = anon
/*/sparql  = anon

## allow users access to datasets if they have the datasets:<crud> perm
/$/datasets/** = authcBasic,rest[datasets]

## and the rest are restricted
/$/** = authcBasic,user[admin]

## Sparql update is restricted
/*/update/** = authcBasic,user[admin]
/*/upload/** = authcBasic,user[admin]

## Graph Store Protocol (read+write) is restricted — this project only
## ever uses it to WRITE (POST .../data?default), never to read.
/*/data/** = authcBasic,user[admin]

# Everything else is also restricted
/** = authcBasic,user[admin]
